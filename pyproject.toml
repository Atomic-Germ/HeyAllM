[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heyallm"
dynamic = ["version"]
description = "Two LLM characters, one scene, no chat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.28,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
heyallm = "heyallm.server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "heyallm.__version__" }

[tool.setuptools.packages.find]
include = ["heyallm*"]

[tool.setuptools.package-data]
heyallm = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
